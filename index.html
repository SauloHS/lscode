<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LS Code</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div id="menubar"></div>
      </header>
      <div id="main">
        <nav id="activitybar"></nav>
        <aside id="sidebar">
          <div id="sidebar-header">
            <span id="sidebar-title"></span>
            <div id="sidebar-actions"></div>
          </div>
          <div id="sidebar-body"></div>
       </aside>
        <div id="sidebar-resizer"></div>
        <section id="editor-col">
          <div id="tabs"></div>
          <div id="breadcrumbs"></div>
          <div id="editor-wrap">
            <div id="editor"></div>
            <div id="welcome"></div>
          </div>
          <div id="panel-resizer"></div>
          <div id="panel">
            <div id="panel-header">
              <div id="panel-tabs"></div>
              <div id="panel-actions"></div>
            </div>
            <div id="panel-body"></div>
          </div>
        </section>
      </div>
      <footer id="statusbar">
        <div id="status-left"></div>
        <div id="status-right"></div>
      </footer>
    </div>
  </body>
</html>
